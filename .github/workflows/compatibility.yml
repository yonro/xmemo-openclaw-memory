name: Verify compatibility

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: OpenClaw ${{ matrix.openclaw-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openclaw-version: ["2026.6.9", "2026.7.1-2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      - name: Select OpenClaw compatibility target
        run: pnpm add --save-dev --save-exact "openclaw@${{ matrix.openclaw-version }}" --lockfile=false
      - run: pnpm typecheck
      - run: pnpm lint
      - run: python3 scripts/test-publish-workflow.py
      - run: pnpm test
      - run: pnpm build
      - run: npm pack --dry-run
      - run: node scripts/verify-plugin.mjs .
